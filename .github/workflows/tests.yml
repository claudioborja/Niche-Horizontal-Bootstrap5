name: Pruebas de la plantilla

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Recursos, migraciones y navegador
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: tools/requirements-test.txt

      - name: Comprobar recursos locales
        run: python tools/check_assets.py

      - name: Comprobar migraciones y estructura de JavaScript
        run: python -m unittest discover -s tools -p 'test_*.py'

      - name: Instalar herramientas de navegador
        run: python -m pip install -r tools/requirements-test.txt

      - name: Instalar Chromium y sus dependencias del sistema
        run: python -m playwright install --with-deps chromium

      - name: Comprobar las 67 páginas y las interacciones
        run: python tools/check_browser.py
